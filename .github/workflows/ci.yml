name: CI

# Run on every pull request, and on anything that lands on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs the exact versions in package-lock.json.
      # Unlike `npm install` it never changes the lockfile, so CI
      # tests the same dependency tree every single time.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
